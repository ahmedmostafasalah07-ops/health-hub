<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Health Hub</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230B0F14'/><path d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%235B8CFF'/></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Health Hub</h1>
            <div id="user-bar" hidden>
                <span id="user-email"></span>
                <button type="button" id="logout-btn">Log out</button>
            </div>
        </div>
        <nav id="app-nav" hidden>
            <button data-tab="patients" class="active">Patients</button>
            <button data-tab="doctors">Doctors</button>
            <button data-tab="appointments">Appointments</button>
        </nav>
    </header>

    <section id="auth-section" class="auth-card">
        <h2>Sign in to Health Hub</h2>
        <p class="muted">Your data is saved securely in the cloud and synced across your devices.</p>
        <form id="auth-form">
            <input id="auth-email" type="email" placeholder="Email" required>
            <div class="password-wrap">
                <input id="auth-password" type="password" placeholder="Password (min 6 characters)" required>
                <button type="button" id="toggle-password" class="cancel">Show</button>
            </div>
            <div class="auth-actions">
                <button type="submit">Log in</button>
                <button type="button" id="signup-btn" class="cancel">Create account</button>
            </div>
        </form>
        <p id="auth-error" class="error"></p>
        <p id="auth-info" class="info"></p>
    </section>

    <main id="app-main" hidden>
        <section id="patients">
            <h2>Patients</h2>
            <form id="patient-form">
                <input id="p-id" placeholder="ID (P1)">
                <input id="p-name" placeholder="Name">
                <input id="p-age" type="number" placeholder="Age">
                <input id="p-weight" type="number" step="0.1" placeholder="Weight (Kg)">
                <input id="p-height" type="number" step="0.01" placeholder="Height (m)">
                <button type="submit">Add patient</button>
                <button type="button" id="p-cancel" class="cancel" hidden>Cancel</button>
            </form>
            <p id="p-error" class="error"></p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Weight</th><th>BMI</th><th>Category</th><th>Actions</th></tr></thead>
                    <tbody id="p-body"></tbody>
                </table>
            </div>
        </section>

        <section id="doctors" hidden>
            <h2>Doctors</h2>
            <form id="doctor-form">
                <input id="d-id" placeholder="ID (D1)">
                <input id="d-name" placeholder="Name">
                <input id="d-age" type="number" placeholder="Age">
                <input id="d-spec" placeholder="Specialty">
                <button type="submit">Add doctor</button>
                <button type="button" id="d-cancel" class="cancel" hidden>Cancel</button>
            </form>
            <p id="d-error" class="error"></p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Specialty</th><th>Actions</th></tr></thead>
                    <tbody id="d-body"></tbody>
                </table>
            </div>
        </section>

        <section id="appointments" hidden>
            <h2>Appointments</h2>
            <form id="appt-form">
                <select id="a-patient"></select>
                <select id="a-doctor"></select>
                <input id="a-date" type="date">
                <input id="a-reason" placeholder="Reason">
                <select id="a-status">
                    <option value="Scheduled">Scheduled</option>
                    <option value="Completed">Completed</option>
                </select>
                <input id="a-report" placeholder="Doctor's report (optional)">
                <button type="submit">Book appointment</button>
                <button type="button" id="a-cancel" class="cancel" hidden>Cancel</button>
            </form>
            <p id="a-error" class="error"></p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>#</th><th>Date</th><th>Patient</th><th>Doctor</th><th>Reason</th><th>Status</th><th>Doctor's Report</th><th>Actions</th></tr></thead>
                    <tbody id="a-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Patient Health Report Modal -->
    <div id="health-modal" class="modal-backdrop" hidden>
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="hr-title">Health Report</h2>
                <button type="button" id="hr-close" class="cancel">Close</button>
            </div>
            <div id="hr-body"></div>
        </div>
    </div>

    <!-- Doctor's Report / Complete Appointment Modal -->
    <div id="dr-modal" class="modal-backdrop" hidden>
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="dr-title">Doctor's Report</h2>
                <button type="button" id="dr-close" class="cancel">Close</button>
            </div>
            <p id="dr-subtitle" class="muted"></p>
            <form id="dr-form" class="modal-form">
                <label class="field-label">Status</label>
                <select id="dr-status">
                    <option value="Completed">Completed</option>
                    <option value="Scheduled">Scheduled</option>
                </select>
                <label class="field-label">Doctor's Report</label>
                <textarea id="dr-report" rows="5" placeholder="Write diagnosis, notes, or prescription..."></textarea>
                <div class="auth-actions">
                    <button type="submit">Save Report</button>
                    <button type="button" id="dr-cancel" class="cancel">Cancel</button>
                </div>
            </form>
            <p id="dr-error" class="error"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
